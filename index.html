<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sucher">
<meta name="theme-color" content="#0e0d0c">
<title>Sucher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --body:#0e0d0c; --plate:#1a1917; --line:#2e2c29; --chrome:#cfc9be; --dim:#857f75; --brass:#c6a46a;
  --f-ui:"Jost","Hiragino Sans",system-ui,sans-serif; --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--body);color:var(--chrome);font-family:var(--f-ui);overflow:hidden;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-left,0px));
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 2px}
.mark{font-weight:600;letter-spacing:.42em;font-size:14px}
.info{font-family:var(--f-mono);font-size:11px;color:var(--dim);letter-spacing:.08em}
.info b{color:var(--brass);font-weight:500}
.finder{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#gl{max-width:100%;max-height:100%;display:block;background:#000}
.lines{position:absolute;pointer-events:none;border:1px solid rgba(207,201,190,.35)}
.flash{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.on{opacity:.85;transition:none}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
.start button{appearance:none;border:1px solid var(--brass);background:none;color:var(--brass);font:500 15px var(--f-ui);letter-spacing:.1em;padding:12px 26px;border-radius:24px}
.start p{margin:0;font-size:12px;color:var(--dim);line-height:1.6;max-width:30em}
.rack{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:10px}
.film{appearance:none;border:1px solid var(--line);background:var(--plate);color:var(--chrome);border-radius:6px;padding:6px 2px;
  font-family:var(--f-ui);display:flex;flex-direction:column;align-items:center;gap:1px}
.film .n{font-size:13px;font-weight:500}.film .iso{font-family:var(--f-mono);font-size:9px;color:var(--dim)}
.film[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}.film[aria-pressed="true"] .iso{color:var(--brass)}
.dials{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-top:8px}
.dial{display:flex;flex-direction:column;gap:2px;min-width:0}
.dial label{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);letter-spacing:.04em}
.dial output{font-family:var(--f-mono);color:var(--chrome)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--chrome);margin-top:-7px;border:2px solid var(--body)}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 0 8px}
.thumb{justify-self:start;width:52px;height:52px;border-radius:6px;border:1px solid var(--line);background:var(--plate) center/cover no-repeat;padding:0}
.shutter{appearance:none;width:76px;height:76px;border-radius:50%;border:3px solid var(--chrome);background:var(--plate);display:grid;place-items:center;padding:0}
.shutter span{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e3d0a6,var(--brass) 55%,#8a6f3e);transition:transform .1s}
.shutter:active span{transform:scale(.9)}
.shutter:disabled{opacity:.4}
.side{justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.icon{appearance:none;background:none;border:none;color:var(--chrome);padding:4px;display:flex;align-items:center;gap:6px;font:12px var(--f-ui)}
.icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5}
.toggle{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
.toggle input{accent-color:var(--brass);width:16px;height:16px;margin:0}
.sheet{position:fixed;inset:0;background:rgba(10,9,8,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet img{max-width:100%;max-height:72%;-webkit-touch-callout:default;-webkit-user-select:auto}
.sheet p{margin:0;font-size:12px;color:var(--dim)}
.sheet .btns{display:flex;gap:10px}
.sheet button{appearance:none;border:1px solid var(--line);background:var(--plate);color:var(--chrome);border-radius:20px;padding:10px 20px;font:14px var(--f-ui)}
.sheet button.primary{border-color:var(--brass);color:var(--brass)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.flash,.shutter span{transition:none}}
</style>
</head>
<body>
<div class="top">
  <div class="mark">SUCHER</div>
  <div class="info"><b id="cnt">00</b> · <span id="filmLabel">CLASSIC 400</span></div>
</div>

<div class="finder" id="finder">
  <canvas id="gl"></canvas>
  <div class="lines" id="lines" hidden></div>
  <div class="flash" id="flash"></div>
  <div class="start" id="start">
    <button id="go">カメラを起動</button>
    <p id="msg">ファインダーにリアルタイムでフィルムの色がのります。<br>シャッターでカメラの最大解像度のまま現像します。</p>
  </div>
</div>

<div class="rack">
  <button class="film" data-p="classic" aria-pressed="true"><span class="n">Classic</span><span class="iso">400 · 暖色</span></button>
  <button class="film" data-p="chrome" aria-pressed="false"><span class="n">Chrome</span><span class="iso">200 · 渋め</span></button>
  <button class="film" data-p="mono" aria-pressed="false"><span class="n">Mono</span><span class="iso">100 · 白黒</span></button>
  <button class="film" data-p="soft" aria-pressed="false"><span class="n">Soft</span><span class="iso">160 · 淡い</span></button>
</div>
<div class="dials">
  <div class="dial"><label for="ev">露出 <output id="evo">±0</output></label><input id="ev" type="range" min="-10" max="10" value="0"></div>
  <div class="dial"><label for="k">効き <output id="ko">80</output></label><input id="k" type="range" min="0" max="100" value="80"></div>
  <div class="dial"><label for="g">粒子 <output id="go2">35</output></label><input id="g" type="range" min="0" max="100" value="35"></div>
  <div class="dial"><label for="v">減光 <output id="vo">40</output></label><input id="v" type="range" min="0" max="100" value="40"></div>
</div>

<div class="row">
  <button class="thumb" id="thumb" aria-label="最後の1枚を見る" disabled></button>
  <button class="shutter" id="shutter" aria-label="撮影" disabled><span></span></button>
  <div class="side">
    <button class="icon" id="flip" aria-label="カメラ切替"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><path d="M9.5 13.5a2.5 2.5 0 0 0 4.5 1.4M14.5 12.5a2.5 2.5 0 0 0-4.5-1.4M14 15l.2-1.6 1.5.4M10 11l-.2 1.6-1.5-.4"/></svg></button>
    <label class="toggle"><input type="checkbox" id="lineT" checked> 枠線</label>
  </div>
</div>

<video id="vid" playsinline muted autoplay hidden></video>

<script>
(() => {
const $ = id => document.getElementById(id);
const ls = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };

const PRESETS = {
  classic:{label:'CLASSIC 400',contrast:.45,lift:.045,roll:.97, sat:.88,mono:0,sh:[-.02,.01,.035],hi:[.045,.02,-.035]},
  chrome: {label:'CHROME 200', contrast:.6, lift:.025,roll:.98, sat:.72,mono:0,sh:[-.03,0,.04],   hi:[.02,.012,-.01]},
  mono:   {label:'MONO 100',   contrast:.75,lift:.03, roll:.985,sat:0,  mono:1,sh:[0,0,.005],     hi:[.012,.006,0]},
  soft:   {label:'SOFT 160',   contrast:.15,lift:.085,roll:.94, sat:.82,mono:0,sh:[0,.015,.03],   hi:[.04,.012,.005]},
};
let preset = PRESETS[ls.get('sucher.preset')] ? ls.get('sucher.preset') : 'classic';

const VS = `attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const FS = `precision highp float;
varying vec2 uv;uniform sampler2D tex;uniform vec2 res;uniform vec3 sh,hi;
uniform float k,gr,vg,ev,contrast,lift,roll,sat,mono,seed,mirror,gs;
float hash(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float cv(float x){x=clamp(x,0.,1.);float s=x*x*(3.-2.*x);float y=x+(s-x)*contrast;y=lift+y*(roll-lift);return mix(x,y,k);}
void main(){
  vec2 t=uv; if(mirror>.5)t.x=1.-t.x;
  vec3 c=texture2D(tex,t).rgb*exp2(ev);
  vec3 o=vec3(cv(c.r),cv(c.g),cv(c.b));
  float l=dot(o,vec3(.2126,.7152,.0722));
  if(mono>.5){l=cv(dot(c,vec3(.42,.46,.12)));o=vec3(l);}
  else{float s2=1.+(sat-1.)*k;o=vec3(l)+(o-vec3(l))*s2;}
  float s1=(1.-l)*(1.-l),h1=l*l;o+=(sh*s1+hi*h1)*k;
  vec2 d=(uv-.5)*res;float r=dot(d,d)/dot(res*.5,res*.5);o*=1.-vg*.55*r*r;
  float n=(hash(floor(uv*res/gs)+seed)-.5)*gr*.16*(.35+2.6*l*(1.-l));o+=n;
  gl_FragColor=vec4(clamp(o,0.,1.),1.);
}`;

function renderer(canvas){
  const gl = canvas.getContext('webgl',{preserveDrawingBuffer:true,premultipliedAlpha:false});
  if(!gl) return null;
  const sh = (t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;};
  const pr = gl.createProgram(); gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS)); gl.linkProgram(pr); gl.useProgram(pr);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tx);
  [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(w=>gl.texParameteri(gl.TEXTURE_2D,w,gl.CLAMP_TO_EDGE));
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  const U = n => gl.getUniformLocation(pr,n);
  return (src, opt) => {
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,src);
    const p = PRESETS[preset];
    gl.uniform2f(U('res'),canvas.width,canvas.height);
    gl.uniform3fv(U('sh'),p.sh); gl.uniform3fv(U('hi'),p.hi);
    gl.uniform1f(U('contrast'),p.contrast); gl.uniform1f(U('lift'),p.lift); gl.uniform1f(U('roll'),p.roll);
    gl.uniform1f(U('sat'),p.sat); gl.uniform1f(U('mono'),p.mono);
    gl.uniform1f(U('k'),$('k').value/100); gl.uniform1f(U('gr'),$('g').value/100); gl.uniform1f(U('vg'),$('v').value/100);
    gl.uniform1f(U('ev'),$('ev').value/10);
    gl.uniform1f(U('seed'),opt.seed); gl.uniform1f(U('mirror'),opt.mirror?1:0);
    gl.uniform1f(U('gs'),Math.max(1,Math.round(Math.max(canvas.width,canvas.height)/1400)));
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  };
}

const vid = $('vid'), view = $('gl');
const draw = renderer(view);
let stream = null, facing = 'environment', running = false, count = 0, lastBlob = null;

async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:false,video:{
      facingMode:facing, width:{ideal:4032}, height:{ideal:3024}, frameRate:{ideal:30}}});
  }catch(e){
    $('msg').textContent = location.protocol !== 'https:' && location.hostname !== 'localhost'
      ? 'カメラはHTTPSのページでしか使えません。GitHub Pagesなどに置いて開いてください。'
      : 'カメラを使えませんでした。設定 › Safari › カメラ で「許可」にしてから再度お試しください。';
    $('start').hidden = false; return;
  }
  vid.srcObject = stream; await vid.play().catch(()=>{});
  $('start').hidden = true; $('shutter').disabled = false;
  if(!running){ running = true; loop(); }
}
function fit(){
  const w = vid.videoWidth, h = vid.videoHeight; if(!w) return false;
  const f = $('finder'), sc = Math.min(f.clientWidth/w, f.clientHeight/h);
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const cw = Math.round(w*sc*dpr), ch = Math.round(h*sc*dpr);
  if(view.width!==cw||view.height!==ch){ view.width=cw; view.height=ch; }
  const L = $('lines'), lw = w*sc, lh = h*sc, m = .06;
  L.style.width = lw*(1-2*m)+'px'; L.style.height = lh*(1-2*m)+'px';
  L.hidden = !$('lineT').checked;
  return true;
}
let fr = 0;
function loop(){
  if(vid.readyState >= 2 && fit()) draw(vid,{seed:(fr++%60)*7.3, mirror:facing==='user'});
  requestAnimationFrame(loop);
}

let capR = null; const capC = document.createElement('canvas');
function shoot(){
  if(!vid.videoWidth) return;
  $('flash').classList.add('on'); setTimeout(()=>$('flash').classList.remove('on'),40);
  if(navigator.vibrate) navigator.vibrate(10);
  capC.width = vid.videoWidth; capC.height = vid.videoHeight;
  if(!capR) capR = renderer(capC);
  capR(vid,{seed:Math.random()*100, mirror:false});
  capC.toBlob(b=>{
    if(!b) return;
    lastBlob = b; count++; $('cnt').textContent = String(count).padStart(2,'0');
    const t = $('thumb'); if(t.dataset.url) URL.revokeObjectURL(t.dataset.url);
    t.dataset.url = URL.createObjectURL(b); t.style.backgroundImage = `url(${t.dataset.url})`; t.disabled = false;
  },'image/jpeg',.93);
}

function stamp(){const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;}
function openSheet(){
  if(!lastBlob) return;
  const s = document.createElement('div'); s.className='sheet';
  const im = new Image(); im.src = $('thumb').dataset.url; im.alt = '撮った写真';
  const p = document.createElement('p'); p.textContent = '画像の長押しでも保存できます';
  const btns = document.createElement('div'); btns.className='btns';
  const save = document.createElement('button'); save.className='primary'; save.textContent='写真に保存';
  save.onclick = async () => {
    const file = new File([lastBlob], `sucher_${preset}_${stamp()}.jpg`, {type:'image/jpeg'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file]}); }catch(e){}
    } else {
      const a = document.createElement('a'); a.href = im.src; a.download = file.name; a.click();
    }
  };
  const close = document.createElement('button'); close.textContent='閉じる'; close.onclick=()=>s.remove();
  btns.append(save,close); s.append(im,p,btns); document.body.appendChild(s);
}

function setPreset(n){ preset=n; ls.set('sucher.preset',n);
  document.querySelectorAll('.film').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===n));
  $('filmLabel').textContent = PRESETS[n].label; }
document.querySelectorAll('.film').forEach(b=>b.onclick=()=>setPreset(b.dataset.p));
[['k','ko'],['g','go2'],['v','vo'],['ev','evo']].forEach(([a,o])=>{
  const sv = ls.get('sucher.'+a); if(sv!==null) $(a).value = sv;
  const show = () => { const v=+$(a).value; $(o).textContent = a==='ev' ? (v===0?'±0':(v>0?'+':'')+(v/10).toFixed(1)) : v; };
  show(); $(a).addEventListener('input',()=>{ show(); ls.set('sucher.'+a,$(a).value); });
});
$('ev').addEventListener('dblclick',()=>{ $('ev').value=0; $('ev').dispatchEvent(new Event('input')); });
$('go').onclick = startCam;
$('shutter').onclick = shoot;
$('thumb').onclick = openSheet;
$('flip').onclick = () => { facing = facing==='environment' ? 'user' : 'environment'; if(stream) startCam(); };
$('lineT').onchange = fit;
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && stream && !stream.active) startCam(); });
setPreset(preset);
if(!draw) $('msg').textContent = 'この端末ではWebGLが使えないため動きません。';
})();
</script>
</body>
</html>
