<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sucher">
<meta name="theme-color" content="#000000">
<title>Sucher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#000; --plate:#1d1d1f; --plate2:#2a2a2c; --line:#3a3a3c; --chrome:#e8e6e1; --dim:#8e8c88;
  --gold:#e5c07b; --red:#ff3b30; --focus:#f4d03f;
  --f-ui:"Jost","Hiragino Sans",system-ui,sans-serif; --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--chrome);font-family:var(--f-ui);overflow:hidden;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 4px) max(10px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(10px,env(safe-area-inset-left,0px));
  -webkit-user-select:none;user-select:none;touch-action:none}

/* top plate */
.plate{position:relative;border-radius:22px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,#3a3a3c 0%,#232325 18%,#1b1b1d 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.6)}
.plate::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.sig{font:italic 500 19px/1 "Snell Roundhand","Brush Script MT",cursive;color:#d8d5cf;letter-spacing:.02em}
.metarow{display:flex;align-items:center;gap:12px;font-size:14px}
.metarow button{appearance:none;background:none;border:none;color:var(--chrome);padding:0;display:flex}
.metarow svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
.res{font-size:10px;color:var(--dim);font-family:var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dialwrap{display:flex;align-items:center;gap:4px}
.dialwrap .tick{width:9px;height:2px;background:var(--chrome);opacity:.8}
.dial{position:relative;width:112px;height:112px;border-radius:50%;touch-action:none;
  background:repeating-conic-gradient(#5b5a58 0 2deg,#2c2b2a 2deg 4deg);
  box-shadow:0 0 0 1px #000,0 3px 8px rgba(0,0,0,.7)}
.dial.small{width:92px;height:92px}
.dial .face{position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#2e2e30,#151516 70%);transition:transform .15s ease-out}
.dial .face.drag{transition:none}
.dial .lab{position:absolute;left:50%;top:50%;font:500 10px var(--f-mono);color:#d9d6d0;white-space:nowrap}
.dial .lab.hot{color:var(--gold)}
.dial .knob{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#bdbab4 45%,#6f6d69 100%);box-shadow:0 2px 4px rgba(0,0,0,.7)}
.dial .cap{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);font:9px var(--f-mono);color:var(--dim);letter-spacing:.1em}
.status{text-align:center;font-size:11px;color:var(--dim);padding:6px 0 4px;font-family:var(--f-mono);min-height:22px}

/* finder */
.finder{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#gl{max-width:100%;max-height:100%;display:block;background:#000;touch-action:none}
.ov{position:absolute;pointer-events:none}
.fl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.fl50{width:68%;height:74%}
.fl50 i{position:absolute;width:16px;height:16px;border:2.5px solid #fff6dc;box-shadow:0 0 8px rgba(255,240,200,.7)}
.fl50 i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.fl50 i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.fl50 i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.fl50 i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.fl50 .edge{position:absolute;inset:0;border:1px solid rgba(255,246,220,.75);box-shadow:0 0 6px rgba(255,240,200,.35)}
.fl50 b,.fl75 b{position:absolute;top:-18px;left:2px;font:500 12px var(--f-mono);color:#fff6dc}
.fl75{width:44%;height:48%;border:1px dashed rgba(255,255,255,.55)}
.fl75 b{top:2px;left:5px;font-size:10px;color:rgba(255,255,255,.7)}
.fbox{position:absolute;width:76px;height:48px;border:1.5px solid var(--focus);background:rgba(244,208,63,.18);transform:translate(-50%,-50%);transition:left .12s,top .12s}
.counter{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(20,20,20,.85);border-radius:16px;padding:4px 14px;
  display:flex;align-items:center;gap:10px;font:500 17px var(--f-mono);color:var(--red);letter-spacing:.06em}
.counter span{width:7px;height:7px;border-radius:50%;background:var(--red)}
.flash{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.on{opacity:.9;transition:none}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:#000}
.start button{appearance:none;border:1px solid var(--gold);background:none;color:var(--gold);font:500 15px var(--f-ui);letter-spacing:.1em;padding:12px 26px;border-radius:24px}
.start p{margin:0;font-size:12px;color:var(--dim);line-height:1.7}

/* rulers */
.ruler{position:relative;height:50px;overflow:hidden;touch-action:none;margin-top:4px;
  background:linear-gradient(180deg,#0c0c0c,#1c1c1d 50%,#0c0c0c);border-top:1px solid #2a2a2a;border-bottom:1px solid #000}
.ruler::before,.ruler::after{content:"";position:absolute;top:0;bottom:0;width:44px;z-index:2;pointer-events:none}
.ruler::before{left:0;background:repeating-linear-gradient(90deg,#444 0 1px,transparent 1px 4px),linear-gradient(90deg,#000,transparent)}
.ruler::after{right:0;background:repeating-linear-gradient(90deg,#444 0 1px,transparent 1px 4px),linear-gradient(270deg,#000,transparent)}
.track{position:absolute;top:0;bottom:0;left:0;will-change:transform}
.track .t{position:absolute;bottom:0;width:1px;height:8px;background:#5a5a5a}
.track .t.maj{height:14px;background:#aaa}
.track .n{position:absolute;top:10px;transform:translateX(-50%);font:500 16px var(--f-ui);color:#f2f0ec}
.ruler .mark{position:absolute;left:50%;top:0;width:2px;height:12px;margin-left:-1px;background:#fff;z-index:3}

/* chips & bottom */
.chips{display:flex;justify-content:center;gap:8px;padding:10px 0 4px}
.chip{appearance:none;border:1px solid #333;background:#1c1c1e;color:var(--chrome);font:14px var(--f-ui);padding:7px 14px;border-radius:18px}
.modes{display:flex;justify-content:center;gap:28px;font-size:15px;padding:4px 0}
.modes .on{color:var(--gold)}.modes span:not(.on){color:var(--dim)}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 8px 8px}
.thumb{justify-self:start;width:62px;height:62px;border-radius:12px;border:1px solid #333;background:#1c1c1e center/cover no-repeat;padding:0}
.shutter{appearance:none;width:84px;height:84px;border-radius:50%;border:4px solid #fff;background:transparent;display:grid;place-items:center;padding:0}
.shutter span{width:68px;height:68px;border-radius:50%;background:#fff;transition:transform .1s}
.shutter:active span{transform:scale(.88)}
.shutter:disabled{opacity:.4}
.flip{justify-self:end;width:62px;height:62px;border-radius:50%;border:1px solid #333;background:radial-gradient(circle at 50% 45%,#3a2a1a,#111 70%);display:grid;place-items:center;color:var(--chrome);padding:0}
.flip svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet img{max-width:100%;max-height:72%;-webkit-touch-callout:default;-webkit-user-select:auto}
.sheet p{margin:0;font-size:12px;color:var(--dim)}
.sheet .btns{display:flex;gap:10px}
.sheet button{appearance:none;border:1px solid #333;background:#1c1c1e;color:var(--chrome);border-radius:20px;padding:10px 20px;font:14px var(--f-ui)}
.sheet button.primary{border-color:var(--gold);color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.flash,.shutter span,.dial .face,.fbox{transition:none}}
</style>
</head>
<body>

<div class="plate">
  <div class="meta">
    <div class="sig">Sucher</div>
    <div class="metarow"><span>4:3</span>
      <button id="flipTop" aria-label="カメラ切替"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><path d="M9 13a3 3 0 0 0 5.6 1.5M15 12a3 3 0 0 0-5.6-1.5"/></svg></button>
      <button id="linesBtn" aria-label="枠線の表示切替"><svg viewBox="0 0 24 24"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/></svg></button>
    </div>
    <div class="res" id="res">写真 —</div>
  </div>
  <div class="dialwrap"><div class="tick"></div><div class="dial" id="dEv" aria-label="露出補正ダイヤル"><div class="face"></div><div class="knob"></div></div></div>
  <div class="dialwrap"><div class="tick"></div><div class="dial small" id="dIso" aria-label="粒子（ISO）ダイヤル"><div class="face"></div><div class="knob"></div></div></div>
</div>
<div class="status" id="status">タップでピント位置 · 下のF値でボケ量</div>

<div class="finder" id="finder">
  <canvas id="gl"></canvas>
  <div class="ov" id="ov">
    <div class="fl fl50" id="fl50"><div class="edge"></div><i></i><i></i><i></i><i></i><b>50</b></div>
    <div class="fl fl75" id="fl75"><b>75</b></div>
    <div class="fbox" id="fbox"></div>
    <div class="counter"><b id="cnt">0000</b><span></span></div>
  </div>
  <div class="flash" id="flash"></div>
  <div class="start" id="start">
    <button id="go">カメラを起動</button>
    <p id="msg">画面をタップした所にピントが合い、<br>そこから離れるほど玉ボケになります。</p>
  </div>
</div>

<div class="ruler" id="rF"><div class="track"></div><div class="mark"></div></div>
<div class="ruler" id="rZ"><div class="track"></div><div class="mark"></div></div>

<div class="chips">
  <button class="chip" id="cLens">50/0.95 模型</button>
  <button class="chip" id="cLook">Wetzlar 調</button>
  <button class="chip" id="cEv">+0.0</button>
</div>
<div class="modes"><span class="on">写真</span></div>
<div class="row">
  <button class="thumb" id="thumb" aria-label="最後の1枚を見る" disabled></button>
  <button class="shutter" id="shutter" aria-label="撮影" disabled><span></span></button>
  <button class="flip" id="flip" aria-label="カメラ切替"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><path d="M9 13a3 3 0 0 0 5.6 1.5M15 12a3 3 0 0 0-5.6-1.5"/></svg></button>
</div>

<video id="vid" playsinline muted autoplay hidden></video>

<script>
(() => {
const $ = id => document.getElementById(id);
const ls = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };

// ---------- looks ----------
const LOOKS = {
  wetzlar:{name:'Wetzlar', contrast:.78,lift:-.035,roll:.97, sat:1.08,mono:0,vg:.62,halo:.55,sh:[.018,-.004,-.006],hi:[.045,.016,-.035]},
  mono:   {name:'Mono',    contrast:.85,lift:-.03, roll:.98, sat:0,   mono:1,vg:.55,halo:.35,sh:[0,0,.004],      hi:[.01,.005,0]},
  classic:{name:'Classic', contrast:.45,lift:.04,  roll:.97, sat:.9,  mono:0,vg:.4, halo:.35,sh:[-.02,.01,.035], hi:[.045,.02,-.035]},
  chrome: {name:'Chrome',  contrast:.6, lift:.02,  roll:.98, sat:.72, mono:0,vg:.45,halo:.25,sh:[-.03,0,.04],    hi:[.02,.012,-.01]},
  soft:   {name:'Soft',    contrast:.15,lift:.08,  roll:.94, sat:.82, mono:0,vg:.3, halo:.5, sh:[0,.015,.03],    hi:[.04,.012,.005]},
};
const LOOK_ORDER = Object.keys(LOOKS);
const EV_STOPS = [-2,-1.5,-1,-.5,0,.5,1,1.5,2];
const ISO_STOPS = [[100,.06],[200,.15],[400,.28],[800,.42],[1600,.6],[3200,.82]];
const F_MIN=.95, F_MAX=16, Z_MAX=5;

const S = {
  look: LOOKS[ls.get('s.look')] ? ls.get('s.look') : 'wetzlar',
  ev: +(ls.get('s.ev') ?? 4), iso: +(ls.get('s.iso') ?? 2),
  fT: +(ls.get('s.fT') ?? 0), zT: 0, focus:[.5,.5], lines: ls.get('s.lines') !== '0'
};
const fNum = () => F_MIN * Math.pow(F_MAX/F_MIN, S.fT);
const zoom = () => Math.pow(Z_MAX, S.zT);
const save = () => { ls.set('s.look',S.look); ls.set('s.ev',S.ev); ls.set('s.iso',S.iso); ls.set('s.fT',S.fT); ls.set('s.lines',S.lines?'1':'0'); };

// ---------- shader ----------
const VS = `attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const FS = N => `precision highp float;
#define N ${N}
varying vec2 uv;uniform sampler2D tex;uniform vec2 res,focus;uniform vec3 sh,hi;
uniform float k,gr,vg,ev,contrast,lift,roll,sat,mono,seed,mirror,gs,bR,zoom,halo;
float hash(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
vec2 src(vec2 u){vec2 t=.5+(u-.5)/zoom;if(mirror>.5)t.x=1.-t.x;return clamp(t,0.,1.);}
float cv(float x){x=clamp(x,0.,1.);float s=x*x*(3.-2.*x);float y=x+(s-x)*contrast;y=lift+y*(roll-lift);return clamp(y,0.,1.);}
void main(){
  vec2 asp=vec2(res.x/res.y,1.);
  float d=length((uv-focus)*asp);
  float r=bR*smoothstep(.06,.42,d);
  vec3 acc=vec3(0.);float ws=0.;
  for(int i=0;i<N;i++){
    float fi=float(i);float rr=sqrt((fi+.5)/float(N));float a=fi*2.39996;
    vec3 s=texture2D(tex,src(uv+vec2(cos(a),sin(a))*rr*r/asp)).rgb;
    float l=dot(s,vec3(.3333));float w=1.+pow(l,5.)*24.;
    acc+=s*w;ws+=w;
  }
  vec3 c=acc/ws;
  vec3 g=vec3(0.);
  for(int i=0;i<12;i++){
    float a=float(i)*.5236;float rr=.018+.012*mod(float(i),2.);
    vec3 s=texture2D(tex,src(uv+vec2(cos(a),sin(a))*rr/asp)).rgb;
    g+=max(s-vec3(.72),0.);
  }
  c=c*exp2(ev)+g/12.*halo*vec3(1.6,.75,.35)*3.;
  vec3 o=vec3(cv(c.r),cv(c.g),cv(c.b));
  float l=dot(o,vec3(.2126,.7152,.0722));
  if(mono>.5){l=cv(dot(c,vec3(.42,.46,.12)));o=vec3(l);}
  else{o=vec3(l)+(o-vec3(l))*sat;}
  float s1=(1.-l)*(1.-l),h1=l*l;o+=sh*s1+hi*h1;
  vec2 dv=(uv-.5)*res;float vr=dot(dv,dv)/dot(res*.5,res*.5);o*=1.-vg*.6*vr*vr*1.2-vg*.15*vr;
  float n=(hash(floor(uv*res/gs)+seed)-.5)*gr*.18*(.3+2.8*l*(1.-l));o+=n;
  gl_FragColor=vec4(clamp(o,0.,1.),1.);
}`;

function renderer(canvas, N){
  const gl = canvas.getContext('webgl',{preserveDrawingBuffer:true});
  if(!gl) return null;
  const mk=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(o));return o;};
  const pr=gl.createProgram();gl.attachShader(pr,mk(gl.VERTEX_SHADER,VS));gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,FS(N)));gl.linkProgram(pr);gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
  [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(w=>gl.texParameteri(gl.TEXTURE_2D,w,gl.CLAMP_TO_EDGE));
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  const U={};const u=n=>U[n]||(U[n]=gl.getUniformLocation(pr,n));
  return (srcEl,opt)=>{
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,srcEl);
    const L=LOOKS[S.look];
    gl.uniform2f(u('res'),canvas.width,canvas.height);
    gl.uniform2f(u('focus'),S.focus[0],S.focus[1]);
    gl.uniform3fv(u('sh'),L.sh);gl.uniform3fv(u('hi'),L.hi);
    gl.uniform1f(u('contrast'),L.contrast);gl.uniform1f(u('lift'),L.lift);gl.uniform1f(u('roll'),L.roll);
    gl.uniform1f(u('sat'),L.sat);gl.uniform1f(u('mono'),L.mono);gl.uniform1f(u('vg'),L.vg);gl.uniform1f(u('halo'),L.halo);
    gl.uniform1f(u('gr'),ISO_STOPS[S.iso][1]);gl.uniform1f(u('ev'),EV_STOPS[S.ev]);
    gl.uniform1f(u('bR'),.075*Math.pow(F_MIN/fNum(),1.15));
    gl.uniform1f(u('zoom'),zoom());
    gl.uniform1f(u('seed'),opt.seed);gl.uniform1f(u('mirror'),opt.mirror?1:0);
    gl.uniform1f(u('gs'),Math.max(1,Math.round(Math.max(canvas.width,canvas.height)/1400)));
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  };
}

// ---------- dials ----------
function dial(el, labels, getIdx, setIdx){
  const face = el.querySelector('.face'), step = 32;
  const R = el.offsetWidth/2 - 18;
  const spans = labels.map((t,i)=>{
    const s=document.createElement('span');s.className='lab';s.textContent=t;
    const a=i*step*Math.PI/180;
    s.style.transform=`translate(-50%,-50%) translate(${Math.sin(a)*R}px,${-Math.cos(a)*R}px) rotate(${i*step}deg)`;
    face.appendChild(s);return s;});
  const paint=(deg)=>{face.style.transform=`rotate(${deg}deg)`;const i=getIdx();spans.forEach((s,j)=>s.classList.toggle('hot',j===i));};
  paint(-getIdx()*step);
  let sx=0,base=0,drag=false;
  el.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX-e.clientY;base=-getIdx()*step;face.classList.add('drag');el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointermove',e=>{if(!drag)return;const deg=base+((e.clientX-e.clientY)-sx)*.9;
    const i=Math.max(0,Math.min(labels.length-1,Math.round(-deg/step)));if(i!==getIdx()){setIdx(i);if(navigator.vibrate)navigator.vibrate(4);}
    face.style.transform=`rotate(${Math.max(-(labels.length-1)*step,Math.min(0,deg))}deg)`;spans.forEach((s,j)=>s.classList.toggle('hot',j===getIdx()));});
  const end=()=>{if(!drag)return;drag=false;face.classList.remove('drag');paint(-getIdx()*step);};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  return ()=>paint(-getIdx()*step);
}

// ---------- rulers ----------
function ruler(el, marks, minor, get, set){
  const track = el.querySelector('.track');
  const W = () => el.clientWidth*2.2;
  const build=()=>{
    track.innerHTML='';const w=W();track.style.width=w+'px';
    for(let t=0;t<=1.0001;t+=minor){const d=document.createElement('div');d.className='t';d.style.left=(t*w)+'px';track.appendChild(d);}
    marks.forEach(([t,txt])=>{const d=document.createElement('div');d.className='t maj';d.style.left=(t*w)+'px';track.appendChild(d);
      const n=document.createElement('div');n.className='n';n.textContent=txt;n.style.left=(t*w)+'px';track.appendChild(n);});
    pos();};
  const pos=()=>{track.style.transform=`translateX(${el.clientWidth/2-get()*W()}px)`;};
  let sx=0,st=0,drag=false;
  el.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;st=get();el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointermove',e=>{if(!drag)return;set(Math.max(0,Math.min(1,st-(e.clientX-sx)/W())));pos();});
  const end=()=>drag=false;el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  addEventListener('resize',build);build();
  return pos;
}
const fT = f => Math.log(f/F_MIN)/Math.log(F_MAX/F_MIN);
const fFmt = f => f<1 ? f.toFixed(2).replace(/^0/,'0') : (f<10? (Math.round(f*10)/10).toString() : Math.round(f).toString());
const posF = ruler($('rF'), [.95,1.4,2,2.8,4,5.6,8,11,16].map(f=>[fT(f),String(f)]), .02, ()=>S.fT, t=>{S.fT=t;save();chips();});
const zT = z => Math.log(z)/Math.log(Z_MAX);
ruler($('rZ'), [1,1.5,2,3,5].map(z=>[zT(z),String(z)]), .025, ()=>S.zT, t=>{S.zT=t;});

const evPaint=dial($('dEv'), EV_STOPS.map(v=>v===0?'0':(v>0?'+':'')+v), ()=>S.ev, i=>{S.ev=i;save();chips();});
dial($('dIso'), ISO_STOPS.map(s=>String(s[0])), ()=>S.iso, i=>{S.iso=i;save();});

function chips(){
  const f=fNum(), fz=50*zoom();
  $('cLens').textContent = `${Math.round(fz)}/${fFmt(f)} 模型`;
  $('cLook').textContent = `${LOOKS[S.look].name} 調`;
  const ev=EV_STOPS[S.ev]; $('cEv').textContent = (ev>=0?'+':'')+ev.toFixed(1);
}
$('cLook').onclick=()=>{S.look=LOOK_ORDER[(LOOK_ORDER.indexOf(S.look)+1)%LOOK_ORDER.length];save();chips();};
$('cLens').onclick=()=>{S.fT=0;save();posF();chips();};
chips();

// ---------- camera ----------
const vid=$('vid'), view=$('gl'), draw=renderer(view,28);
let stream=null, facing='environment', running=false, lastBlob=null;
let shots=+(ls.get('s.shots')||0); $('cnt').textContent=String(shots).padStart(4,'0');

async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:facing,width:{ideal:4032},height:{ideal:3024},frameRate:{ideal:30}}});
  }catch(e){
    $('msg').textContent = location.protocol!=='https:'&&location.hostname!=='localhost'
      ? 'カメラはHTTPSのページでしか使えません。' : 'カメラを使えませんでした。設定 › Safari › カメラ で「許可」にしてください。';
    $('start').hidden=false;return;
  }
  vid.srcObject=stream;await vid.play().catch(()=>{});
  $('start').hidden=true;$('shutter').disabled=false;
  if(!running){running=true;loop();}
}
function fit(){
  const w=vid.videoWidth,h=vid.videoHeight;if(!w)return false;
  const f=$('finder'),sc=Math.min(f.clientWidth/w,f.clientHeight/h),dpr=Math.min(devicePixelRatio||1,2);
  const cw=Math.round(w*sc*dpr),ch=Math.round(h*sc*dpr);
  if(view.width!==cw||view.height!==ch){view.width=cw;view.height=ch;}
  const ov=$('ov'),lw=w*sc,lh=h*sc;
  ov.style.width=lw+'px';ov.style.height=lh+'px';
  ov.style.left=(f.clientWidth-lw)/2+'px';ov.style.top=(f.clientHeight-lh)/2+'px';
  $('res').textContent=`写真 ${Math.round(w/zoom())}×${Math.round(h/zoom())} · 現像 GPU`;
  $('fbox').style.left=(S.focus[0]*100)+'%';$('fbox').style.top=((1-S.focus[1])*100)+'%';
  $('fl50').hidden=$('fl75').hidden=!S.lines;
  return true;
}
let fr=0;
function loop(){ if(vid.readyState>=2&&fit()) draw(vid,{seed:(fr++%48)*7.3,mirror:facing==='user'}); requestAnimationFrame(loop); }

view.addEventListener('pointerdown',e=>{
  const r=view.getBoundingClientRect();
  S.focus=[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,1-(e.clientY-r.top)/r.height))];
  if(navigator.vibrate)navigator.vibrate(6);
});

// ---------- capture ----------
let capR=null;const capC=document.createElement('canvas');
function shoot(){
  if(!vid.videoWidth)return;
  $('flash').classList.add('on');setTimeout(()=>$('flash').classList.remove('on'),50);
  const t0=performance.now();
  capC.width=Math.round(vid.videoWidth/zoom());capC.height=Math.round(vid.videoHeight/zoom());
  if(!capR)capR=renderer(capC,72);
  capR(vid,{seed:Math.random()*100,mirror:false});
  capC.toBlob(b=>{
    if(!b)return;
    lastBlob=b;shots++;ls.set('s.shots',shots);$('cnt').textContent=String(shots%10000).padStart(4,'0');
    $('status').textContent=`現像 ${((performance.now()-t0)/1000).toFixed(1)} 秒 · ${capC.width}×${capC.height}`;
    const t=$('thumb');if(t.dataset.url)URL.revokeObjectURL(t.dataset.url);
    t.dataset.url=URL.createObjectURL(b);t.style.backgroundImage=`url(${t.dataset.url})`;t.disabled=false;
  },'image/jpeg',.94);
}
function stamp(){const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;}
function openSheet(){
  if(!lastBlob)return;
  const s=document.createElement('div');s.className='sheet';
  const im=new Image();im.src=$('thumb').dataset.url;im.alt='撮った写真';
  const p=document.createElement('p');p.textContent='画像の長押しでも保存できます';
  const btns=document.createElement('div');btns.className='btns';
  const sv=document.createElement('button');sv.className='primary';sv.textContent='写真に保存';
  sv.onclick=async()=>{const file=new File([lastBlob],`sucher_${S.look}_${stamp()}.jpg`,{type:'image/jpeg'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});}catch(e){}}
    else{const a=document.createElement('a');a.href=im.src;a.download=file.name;a.click();}};
  const cl=document.createElement('button');cl.textContent='閉じる';cl.onclick=()=>s.remove();
  btns.append(sv,cl);s.append(im,p,btns);document.body.appendChild(s);
}

const flip=()=>{facing=facing==='environment'?'user':'environment';if(stream)startCam();};
$('go').onclick=startCam;$('shutter').onclick=shoot;$('thumb').onclick=openSheet;
$('flip').onclick=flip;$('flipTop').onclick=flip;
$('linesBtn').onclick=()=>{S.lines=!S.lines;save();};
$('cEv').onclick=()=>{S.ev=4;save();chips();evPaint();};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&stream&&!stream.active)startCam();});
if(!draw)$('msg').textContent='この端末ではWebGLが使えないため動きません。';
})();
</script>
</body>
</html>
